# Weekly version updates, one pull request per ecosystem.
#
# Not covered: .bazelversion and the bazel_dep versions in MODULE.bazel, which
# bazel-updates.yaml advances (Dependabot cannot evaluate a MODULE.bazel whose
# extensions read files it does not fetch, as rules_js does), and Zola, which
# has its own workflow (update-zola.yml).
version: 2
updates:
  # The Cloudflare provider: its version in infra/main.tf and the lock beside
  # it, which rules_tofu reads (tf_providers.from_lock in MODULE.bazel).
  # "opentofu", not "terraform", which can't read an OpenTofu lock.
  - package-ecosystem: opentofu
    directory: /infra
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
