name: Infra

# Keeps the domain's DNS records and email routing in line with infra/: plans
# on pull requests that change it, applies on pushes to main. State is in
# Cloudflare R2, locked while a run uses it. Dependabot's pull requests get the
# same secrets from the repository's Dependabot secrets, so its provider
# updates are planned too.

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "tools/r2-keys.sh"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "infra/**"
      - "tools/r2-keys.sh"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

# Plans and applies queue separately.
# - Pull requests: one plan each, and a new push cancels the old plan. Plans
#   only read the state, so they take no lock (-lock=false): a cancelled plan
#   can't leave it held, and plans never wait on an apply.
# - Applies: one at a time and never cancelled, because an apply stopped
#   half-way leaves the zone half-changed (and the state lock held).
# An apply waits for the state lock (-lock-timeout) if someone holds it, for
# example infra/run.sh, instead of failing on it.
concurrency:
  group: infra-${{ github.event_name == 'pull_request' && format('plan-{0}', github.event.pull_request.number) || 'apply' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  infra:
    # Pull requests from forks get no secrets, so there's nothing to plan with.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_forward_to: ${{ secrets.FORWARD_TO }}
    steps:
      - uses: actions/checkout@v7
      # The state bucket's S3 keys, derived from the Cloudflare token and
      # masked in the log.
      - name: R2 keys
        run: |
          keys=$(tools/r2-keys.sh)
          while IFS= read -r line; do
            echo "::add-mask::${line#*=}"
            echo "$line" >> "$GITHUB_ENV"
          done <<<"$keys"
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Plan
        if: github.event_name == 'pull_request'
        run: bazel run //infra:infra.plan -- -lock=false -no-color
      - name: Apply
        if: github.event_name != 'pull_request'
        run: bazel run //infra:infra.apply -- -lock-timeout=15m -auto-approve -no-color
