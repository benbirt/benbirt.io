name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      # Builds the site and validates the OpenTofu configuration in infra/.
      # There are no test targets, so this is a build: `bazel test` fails
      # when it finds none.
      - run: bazel build //...
      # Every git-tracked file, with the formatters and settings of
      # benbirt/bazel-style.
      - name: Check formatting
        run: bazel run //tools:format.check
      # Checks every Starlark file in the workspace; fails on any buildifier
      # warning or formatting diff.
      - name: Lint Starlark
        run: bazel run //tools:lint
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: bazel-bin/site/public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
