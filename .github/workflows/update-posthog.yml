name: Update posthog-js

# Opens a pull request when posthog-js has a new release. Runs monthly, because
# posthog-js is released several times a week.

on:
  schedule:
    - cron: "41 5 3 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-posthog

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - id: update
        run: |
          version="$(tools/posthog/update.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Nothing to do if main is up to date, or if the open pull request's
          # branch already holds this update.
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif git fetch --quiet origin update-posthog && git diff --quiet FETCH_HEAD -- MODULE.bazel; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.update.outputs.changed == 'true'
        uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          repository-cache: true
      # Builds with the new posthog-js before proposing it, which also brings
      # MODULE.bazel.lock up to date for the commit.
      - if: steps.update.outputs.changed == 'true'
        run: bazel build //site:public
      - if: steps.update.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C update-posthog
          git commit -am "Update posthog-js to $VERSION"
          git push --force origin update-posthog
          title="Update posthog-js to $VERSION"
          body="posthog-js [$VERSION](https://www.npmjs.com/package/posthog-js/v/$VERSION), as pinned by \`tools/posthog/update.sh\`. The site built with it in the workflow run that last pushed this branch."
          if [ -z "$(gh pr list --head update-posthog --state open --json number --jq '.[].number')" ]; then
            gh pr create --head update-posthog --base main --title "$title" --body "$body"
          else
            gh pr edit update-posthog --title "$title" --body "$body"
          fi
          # A pull request opened with the workflow's own token does not start
          # the Pages workflow, whose build main requires. Starting it by hand
          # on the branch is allowed, and reports on the same commit.
          gh workflow run pages.yml --ref update-posthog
